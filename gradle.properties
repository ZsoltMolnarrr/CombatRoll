# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Mod properties
mod_version = 3.0.1
maven_group = net.combat_roll
archives_name = combat_roll
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version = 26.1.2
# Older 26.x versions this release is also compatible with, for publish game version tags (comma-separated, excludes minecraft_version)
additional_game_versions = 26.1,26.1.1

# no-remap Loom is beta
loom.ignoreDependencyLoomVersionValidation=true

# Dependencies
fabric_loader_version = 0.19.3
fabric_api_version = 0.154.2+26.1.2
neoforge_version = 26.1.2.76

cloth_config_version=26.1.154
player_anim_version=1.2.4+mc.26.1
tiny_config_version=3.1.0

# Compatibility
mod_menu_version=18.0.0
# TODO: Bump to a 26.1 build once Better Combat 3.1.0+26.1 is published (compileOnly API interface only)
better_combat_version=2.3.1+1.21.1