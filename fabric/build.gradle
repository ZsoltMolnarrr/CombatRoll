plugins {
    id 'com.gradleup.shadow'
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

def platform = project.name;

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    mavenCentral()
    maven {
        name = "RedlanceMinecraft"
        url = "https://repo.redlance.org/public"
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$project.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"

    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    include(implementation("maven.modrinth:tiny-config:${project.tiny_config_version}-${platform}"))
    implementation "com.zigythebird.playeranim:PlayerAnimationLibFabric:${project.player_anim_version}"
    implementation("maven.modrinth:modmenu:${project.mod_menu_version}") { transitive false }
    compileOnly("maven.modrinth:better-combat:${project.better_combat_version}-${platform}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    // Build on top of the `jar` task output instead of raw source-set outputs:
    // in no-remap Loom the jar-in-jar nesting (`include`) is applied by `jar`
    // (it was applied by `remapJar` after shadowing, before 26.1).
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

if (project.hasProperty('release_type')) {
    def mppType = release_type == "release" ? me.modmuss50.mpp.ReleaseType.STABLE
            : release_type == "alpha" ? me.modmuss50.mpp.ReleaseType.ALPHA
            : me.modmuss50.mpp.ReleaseType.BETA

    // Preserve the `publishMod` task name so the GitHub Actions workflow keeps working.
    tasks.register("publishMod") {
        dependsOn(build)
        finalizedBy(tasks.named("publishMods"))
    }

    publishMods {
        file = shadowJar.archiveFile
        changelog = changelog_last_section()
        type = mppType
        version = "${project.version}-fabric" // Will fail if Modrinth already has this version
        displayName = "${project.version}"
        modLoaders.add("fabric")

        curseforge {
            projectId = providers.environmentVariable("CURSEFORGE_PROJECT_ID")
            accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
            client = true
            server = true
            rootProject.ext.publishGameVersions().each { minecraftVersions.add(it) }
            requires("fabric-api")
            requires("cloth-config")
            requires("player-animation-library")
        }

        modrinth {
            projectId = providers.environmentVariable("MODRINTH_PROJECT_ID").map { rootProject.ext.resolveModrinthId(it) }
            accessToken = providers.environmentVariable("MODRINTH_API_KEY")
            rootProject.ext.publishGameVersions().each { minecraftVersions.add(it) }
            requires("fabric-api")
            requires("cloth-config")
            requires("player-animation-library")
        }

        github {
            repository = providers.environmentVariable("GH_OWNER")
                    .zip(providers.environmentVariable("GH_REPO")) { owner, repo -> "$owner/$repo" }
            accessToken = providers.environmentVariable("GH_API_KEY")
            commitish = "git rev-parse --abbrev-ref HEAD".execute().text.trim()
            tagName = "${project.version}"
        }
    }
}